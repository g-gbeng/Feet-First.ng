<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<title>Payment | Feet-First.ng</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/pages/payment-callback.css">

<script src="js/common.js" defer></script>
<script src="js/shop.js" defer></script>
<script src="js/pages/payment-callback.js" defer></script>
</head>

<body>

<div id="shell"></div>

<main class="paymentCard" aria-live="polite">

    <div class="statusIcon checking" id="statusIcon" aria-hidden="true"><span class="spinner"></span></div>

    <h1 id="statusTitle">Confirming your payment</h1>

    <p id="statusText">Please wait while we confirm your payment with Paystack. Don't close this page.</p>

    <dl class="orderFacts" id="orderFacts" hidden>
        <div><dt>Order</dt><dd id="factOrder"></dd></div>
        <div><dt>Amount</dt><dd id="factAmount"></dd></div>
    </dl>

    <p class="testNote" id="testNote" hidden>Test mode: no real money was charged.</p>

    <div class="actions" id="actions" hidden>
        <a href="orders.html" class="btn btn-gold" id="ordersLink">View my orders</a>
        <button type="button" class="btn btn-outline-gold" id="retryBtn" hidden>Check again</button>
        <a href="dashboard.html" class="btn btn-outline-secondary" id="shopLink">Back to the shop</a>
    </div>

</main>

</body>
</html>
