<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Saved Items | Feet-First.ng</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/pages/favorites.css">

<script src="js/common.js" defer></script>
<script src="js/shop.js" defer></script>
<script src="js/pages/favorites.js" defer></script>
</head>

<body>

<div id="shell"></div>

<main class="container favoritesPage">

    <div class="pageHead">
        <div>
            <h1>Saved Items</h1>
            <p id="savedSummary" aria-live="polite"></p>
        </div>
        <button type="button" class="btn btn-outline-danger" id="clearFavoritesBtn" hidden>Clear saved items</button>
    </div>

    <section id="favoritesList" aria-label="Saved items">
        <div class="loadingState"><span class="spinner"></span></div>
    </section>

</main>

<!-- size picker -->
<dialog class="sheet" id="sizeDialog" aria-labelledby="sizeDialogTitle">
    <form method="dialog" id="sizeForm" novalidate>
        <div class="sheetHead">
            <h2 id="sizeDialogTitle">Choose your size</h2>
            <button type="button" class="iconBtn" data-close aria-label="Close"></button>
        </div>
        <div class="sheetBody">
            <p class="fw-semibold mb-2" id="selectedProductName"></p>
            <div class="field">
                <label class="form-label" for="selectedSize">Size</label>
                <select class="form-select" id="selectedSize" required>
                    <option value="">Choose size</option>
                </select>
                <small class="fieldError" id="selectedSizeError"></small>
            </div>
            <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" id="keepSaved">
                <label class="form-check-label" for="keepSaved">Keep it in my saved items too</label>
            </div>
        </div>
        <div class="sheetFoot">
            <button type="button" class="btn btn-outline-secondary" data-close>Cancel</button>
            <button type="submit" class="btn btn-gold" id="confirmMoveBtn" value="add">Add to cart</button>
        </div>
    </form>
</dialog>

</body>
</html>
