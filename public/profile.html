<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Profile | Feet-First.ng</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/pages/profile.css">

<script src="js/common.js" defer></script>
<script src="js/shop.js" defer></script>
<script src="js/pages/profile.js" defer></script>
</head>

<body>

<div id="shell"></div>

<main class="profileLayout">

    <aside class="card-box text-center">
        <div id="profileAvatar" class="profilePic">U</div>
        <div id="displayName" class="profileName"></div>
        <div id="displayEmail" class="profileEmail"></div>
        <a href="orders.html" class="btn btn-gold btn-sm w-100 mt-4">My Orders</a>
        <button type="button" id="profileLogout" class="btn btn-outline-danger btn-sm w-100 mt-2">Log out</button>
    </aside>

    <div class="stack">

        <form class="card-box" id="profileForm" novalidate>
            <h2>Personal information</h2>
            <p class="formNotice ok" id="profileNotice" hidden></p>
            <div class="field mb-3">
                <label class="form-label" for="fullName">Full name</label>
                <input id="fullName" class="form-control" autocomplete="name" maxlength="80" required>
                <small class="fieldError" id="fullNameError"></small>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input id="email" class="form-control" disabled>
                <small class="formHint">Your email can't be changed here.</small>
            </div>
            <button type="submit" class="btn btn-gold" id="saveProfileBtn">Save changes</button>
        </form>

        <form class="card-box" id="passwordForm" novalidate>
            <h2>Change password</h2>
            <p class="formNotice" id="passwordNotice" hidden></p>
            <div class="field mb-3">
                <label class="form-label" for="currentPassword">Current password</label>
                <div class="passwordWrap">
                    <input type="password" id="currentPassword" class="form-control" autocomplete="current-password" required>
                    <button type="button" class="togglePassword" data-for="currentPassword"></button>
                </div>
                <small class="fieldError" id="currentPasswordError"></small>
            </div>
            <div class="field mb-3">
                <label class="form-label" for="newPassword">New password</label>
                <div class="passwordWrap">
                    <input type="password" id="newPassword" class="form-control" autocomplete="new-password" required aria-describedby="newPasswordHint">
                    <button type="button" class="togglePassword" data-for="newPassword"></button>
                </div>
                <small class="formHint" id="newPasswordHint">At least 8 characters, with a number and a symbol.</small>
                <small class="fieldError" id="newPasswordError"></small>
            </div>
            <button type="submit" class="btn btn-dark" id="savePasswordBtn">Change password</button>
        </form>

    </div>

</main>

</body>
</html>
