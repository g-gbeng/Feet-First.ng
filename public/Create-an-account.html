<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Create an account | Feet-First.ng</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/pages/auth.css">

<script src="js/common.js" defer></script>
<script src="js/pages/signup.js" defer></script>
</head>

<body>

<main class="authCard">

    <a href="index.html" class="logo">Feet-First<span>.ng</span></a>

    <h1>Create Account</h1>

    <form id="signupForm" novalidate>

        <p class="formNotice" id="formNotice" role="alert" hidden></p>

        <div class="field mb-3">
            <label class="form-label" for="name">Full name</label>
            <input type="text" id="name" class="form-control" placeholder="Enter your full name" autocomplete="name" maxlength="80" required>
            <small class="fieldError" id="nameError"></small>
        </div>

        <div class="field mb-3">
            <label class="form-label" for="email">Email address</label>
            <input type="email" id="email" class="form-control" placeholder="Enter your email" autocomplete="email" maxlength="120" required>
            <small class="fieldError" id="emailError"></small>
        </div>

        <div class="field mb-3">
            <label class="form-label" for="password">Password</label>
            <div class="passwordWrap">
                <input type="password" id="password" class="form-control" placeholder="Letters, numbers & symbols" autocomplete="new-password" required aria-describedby="passwordHint">
                <button type="button" class="togglePassword" data-for="password"></button>
            </div>
            <small class="formHint" id="passwordHint">At least 8 characters, with a number and a symbol (e.g. ! @ # $).</small>
            <small class="fieldError" id="passwordError"></small>
        </div>

        <div class="field mb-3">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <div class="passwordWrap">
                <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter your password" autocomplete="new-password" required>
                <button type="button" class="togglePassword" data-for="confirmPassword"></button>
            </div>
            <small class="fieldError" id="confirmPasswordError"></small>
        </div>

        <button type="submit" class="btn btn-auth" id="signupBtn">Sign up</button>

        <p class="switch">Already have an account? <a href="login.html" id="loginLink">Log in here</a></p>

        <p class="switch small">By signing up you agree to our <a href="terms-of-service.html">Terms</a> and <a href="privacy-policy.html">Privacy Policy</a>.</p>

    </form>

</main>

</body>
</html>
