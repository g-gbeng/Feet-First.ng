<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Your Cart | Feet-First.ng</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/pages/cart.css">

<script src="js/common.js" defer></script>
<script src="js/shop.js" defer></script>
<script src="js/pages/cart.js" defer></script>
</head>

<body>

<div id="shell"></div>

<main class="container cartPage">

    <div class="pageHead">
        <div>
            <h1>Your Cart</h1>
            <p id="cartSummary" aria-live="polite"></p>
        </div>
        <button type="button" class="btn btn-outline-danger" id="clearCartBtn" hidden>Clear cart</button>
    </div>

    <div class="cartLayout">

        <section id="cartItems" aria-label="Items in your cart">
            <div class="loadingState"><span class="spinner"></span></div>
        </section>

        <aside class="summaryBox" id="summaryBox" hidden>
            <h2>Order summary</h2>
            <div class="row1"><span>Subtotal</span><strong id="cartTotal">₦0</strong></div>
            <p class="note">Delivery is arranged after payment.</p>
            <p class="formNotice" id="unavailableNotice" hidden>Some items are no longer available. Remove them to continue.</p>
            <a href="checkout.html" class="btn btn-gold w-100" id="checkoutBtn">Proceed to checkout</a>
            <a href="dashboard.html" class="btn btn-link w-100 mt-1">Continue shopping</a>
        </aside>

    </div>

</main>

</body>
</html>
