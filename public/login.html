<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Log in | Feet-First.ng</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/pages/auth.css">

<script src="js/common.js" defer></script>
<script src="js/pages/login.js" defer></script>
</head>

<body>

<main class="authCard">

    <a href="index.html" class="logo">Feet-First<span>.ng</span></a>

    <h1>Shop With Us</h1>

    <form id="loginForm" novalidate>

        <p class="formNotice" id="formNotice" role="alert" hidden></p>

        <div class="field mb-3">
            <label class="form-label" for="email">Email address</label>
            <input type="email" id="email" class="form-control" placeholder="Enter your email" autocomplete="email" required>
            <small class="fieldError" id="emailError"></small>
        </div>

        <div class="field mb-3">
            <label class="form-label" for="password">Password</label>
            <div class="passwordWrap">
                <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
                <button type="button" class="togglePassword" data-for="password"></button>
            </div>
            <small class="fieldError" id="passwordError"></small>
        </div>

        <button type="submit" class="btn btn-auth" id="loginBtn">Log in</button>

        <p class="switch">Don't have an account? <a href="Create-an-account.html" id="signupLink">Create one</a></p>

    </form>

</main>

</body>
</html>
