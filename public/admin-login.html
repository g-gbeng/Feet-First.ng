<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<title>Admin Login | Feet-First.ng</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/pages/admin-login.css">

<script src="js/common.js" defer></script>
<script src="js/pages/admin-login.js" defer></script>
</head>

<body>

<main class="loginCard">

    <h1>Admin Login</h1>
    <p class="sub">Feet-First.ng Management Panel</p>

    <form id="adminLoginForm" novalidate>

        <p class="formNotice" id="errorMsg" role="alert" hidden></p>

        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" autocomplete="username" placeholder="Enter admin email" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <div class="passwordWrap">
                <input type="password" class="form-control" id="password" autocomplete="current-password" placeholder="Enter password" required>
                <button type="button" class="togglePassword" data-for="password"></button>
            </div>
        </div>

        <button type="submit" class="btn btn-gold w-100 mt-3" id="loginBtn">Log in</button>

    </form>

</main>

</body>
</html>
